# Data sources. Every fetcher caches to data/raw so later runs (and the demo) are offline.

bbox:            # India subset kept on disk (the download itself is chunk-limited, see docs)
  lat: [5.0, 40.0]
  lon: [65.0, 100.0]

weatherbench2:
  bucket: weatherbench2/datasets
  byte_cap_gb: 6.0          # hard stop: running transfer total may never exceed this
  workers: 6                # parallel chunk requests
  init_hour_utc: 0          # 00 UTC initialisations only
  stores:
    hres:
      path: hres/2016-2022-0012-240x121_equiangular_with_poles_conservative.zarr
      label: ECMWF IFS HRES
    graphcast:
      # GraphCast (operational-style v2) is published for 2018, 2020 and 2022 only.
      path_by_year:
        2020: graphcast_v2/2020-240x121_equiangular_with_poles_conservative.zarr
        2022: graphcast_v2/2022-240x121_equiangular_with_poles_conservative.zarr
      label: GraphCast
    era5:
      path: era5/1959-2023_01_10-6h-240x121_equiangular_with_poles_conservative.zarr
      label: ERA5 reanalysis (truth)
  forecast_variables: [total_precipitation_24hr, mean_sea_level_pressure]
  truth_variables: [total_precipitation_24hr]
  # Ordered download phases. A phase only starts when the previous one finished cleanly.
  phases:
    - name: jjas-2020-2021-d1to7
      seasons: [2020, 2021]
      lead_days: [1, 3, 5, 7]     # chunks holding these leads also contain days 2, 4, 6 (free)
    - name: jjas-2022-d1to7
      seasons: [2022]
      lead_days: [1, 3, 5, 7]
    - name: day10-all
      seasons: [2020, 2021, 2022]
      lead_days: [10]
  season_months: [6, 7, 8, 9]   # JJAS initialisations

open_meteo:
  # Quick-start / recent track. previous_dayN (N=0..7) = run issued N days earlier = lead day N+1
  # (Day 1-8 only: the Previous Runs archive stops at previous_day7).
  previous_runs_url: https://previous-runs-api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  models: [ecmwf_ifs025, gfs_seamless, icon_seamless]
  variables: [precipitation, temperature_2m]
  previous_days: [0, 1, 2, 3, 4, 5, 6, 7]
  periods:
    - [2024-06-01, 2024-09-30]
    - [2025-06-01, 2025-09-30]
    - [2026-06-01, 2026-09-28]
  timezone: Asia/Kolkata
  max_weighted_calls_per_hour: 4500

imd:
  # IMD 0.25 deg gridded rainfall via imdlib (optional independent truth for rainfall)
  years: [2020, 2021, 2022]
  variable: rain
