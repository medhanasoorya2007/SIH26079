# IMD meteorological subdivisions = BustGuard's verification regions (v2).
#
# Geometry is derived, not hand-drawn: every IMD 0.25 deg land cell is assigned to a state
# (Natural Earth 50m admin-1, data/raw/shapes) and then to a subdivision. Where IMD splits a
# state into several subdivisions, the cell goes to the subdivision of the nearest anchor
# (approximate city locations). The map outline is therefore IMD's own gridded-data domain.
# This is an approximation of the official IMD subdivision boundaries; if an official
# boundary file is placed at data/raw/shapes/imd_subdivisions.geojson (property `name`
# matching the names below) it is used instead.
state_file: ne_50m_admin_1.geojson
official_file: imd_subdivisions.geojson
# IMD grid cells north of 32N / west of 81E that fall outside the 50m state polygons belong to
# Jammu & Kashmir and Ladakh (India's official extent, as covered by the IMD grid).
northern_fallback: {id: jk_ladakh, min_lat: 32.0, max_lon: 81.0}

