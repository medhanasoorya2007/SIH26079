# Model + evaluation settings.
split:
  test_years: [2022]        # latest year held out (time-based split; never shuffled)
  # all earlier years are used for training; calibration uses out-of-fold (leave-one-year-out)

lightgbm:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 40
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  class_weight: balanced
  random_state: 42
  verbose: -1

calibration:
  method: isotonic          # isotonic | sigmoid

baseline:
  # Raw score used as the operational-style baseline. With WeatherBench 2 (no ENS members
  # downloaded) this is HRES-vs-GraphCast disagreement; swap to `ens_spread` if available.
  score_column: sig_disagreement_abs
  name: HRES vs GraphCast disagreement

eval:
  false_alarm_rates: [0.05, 0.10, 0.20]   # compare model vs baseline recall at these FARs
  reliability_bins: 10

analogs:
  k: 8
  features: [fc, sig_fc_neigh_mean, sig_fc_neigh_std, sig_mslp_anom, sig_geo_vorticity, lead_day, doy_sin, doy_cos]

risk_levels:               # bust probability -> operational risk level
  - {name: Low,      max: 0.15}
  - {name: Moderate, max: 0.35}
  - {name: High,     max: 0.60}
  - {name: Severe,   max: 1.01}
