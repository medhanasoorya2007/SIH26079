# Model + evaluation settings.
split:                      # by year, never shuffled
  train_years: [2018, 2019]         # model, scalers, climatologies, label thresholds
  calibration_years: [2020]         # isotonic calibrators + baseline fits (train+calibration)
  test_years: [2021, 2022]          # fully unseen: every number in docs/results.md
  # replay-event windows (configs/replay_events.yaml) are excluded from train + calibration

issue_time:
  # IMD date D closes at 03 UTC on D, i.e. rain day D-1. At a 00 UTC issue on day I the
  # newest verified rain day is I-2 (its IMD file closes at 03 UTC on I-1).
  verification_lag_days: 2

lightgbm:                   # base parameters
  n_estimators: 300
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 100
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.7
  reg_lambda: 5.0
  class_weight: balanced
  random_state: 42
  verbose: -1

# Small grid; the combination with the best CALIBRATION-block PR-AUC is kept (never test).
lightgbm_grid:
  - {num_leaves: 7, min_child_samples: 200}
  - {num_leaves: 15, min_child_samples: 100}
  - {num_leaves: 31, min_child_samples: 50}
  - {num_leaves: 15, min_child_samples: 100, class_weight: null}
  - {num_leaves: 7, min_child_samples: 200, n_estimators: 600, learning_rate: 0.015}

calibration:
  method: isotonic          # isotonic | sigmoid

baselines:
  # v2 #5: both baselines are always reported next to BustGuard.
  spread_iso:
    kind: spread_isotonic
    score_column: sig_spread
    name: "Lagged-ensemble spread"
  spread_lr:
    kind: logistic
    columns: [sig_spread, sig_lead_day]
    name: "Logistic (spread + lead day)"

eval:
  primary_metric: pr_auc
  operating_far: 0.10                     # alerts/CSI/early warning use this false-alarm rate,
                                          # with thresholds frozen on the calibration block
  false_alarm_rates: [0.05, 0.10, 0.20]   # recall at these FARs (ROC curve, test)
  reliability_bins: 10
  scorecard_min_busts: 8
  ablation: true

analogs:
  k: 8
  features: [fc, sig_spread, sig_fc_sub_std, sig_mslp_anom, sig_geo_vorticity, sig_tcwv_anom, sig_up_fc, sig_doy_sin, sig_doy_cos]

risk_levels:                # bust probability thresholds frozen on the calibration block
  medium_far: 0.20            # MEDIUM: flagged at a 20% false-alarm rate
  high_far: 0.10              # HIGH:   flagged at a 10% false-alarm rate (= operating point)

confidently_wrong:
  spread_column: sig_spread
  quantile: 0.3333            # low spread = lowest third within regime + season (month)
  group_by: [regime, month]
  min_group_size: 30
  analog_min_rate: 0.25       # analogs agree: >= 25% of analog cases busted

costloss:
  # Illustrative cost/loss ratios (C/L) for acting on a bust warning. Assumptions, editable.
  users:
    disaster_manager: {alpha: 0.02, label: "Disaster manager", action: "pre-position teams / issue precautionary alert"}
    power_utility: {alpha: 0.05, label: "Power utility", action: "hold reserve generation / reschedule maintenance"}
    farmer: {alpha: 0.15, label: "Farmer", action: "delay spraying, harvest or irrigation decisions"}
