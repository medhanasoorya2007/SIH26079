# Bust definitions. `default` is what train/eval/API use; every definition is computed and
# stored as bust_<name> so any of them can be selected (``pipelines.train --labels``).

default: imd_category

definitions:
  # v2 default: IMD 24-h rainfall categories (mm/day, subdivision area-mean)
  #   0 Light/Moderate <= 64.4 | 1 Heavy 64.5-115.5 | 2 Very heavy 115.6-204.4 | 3 Extremely heavy >= 204.5
  # Bust = observed category differs from forecast category by >= 2 classes,
  #        OR observed >= Heavy while the forecast was below Heavy (missed warning).
  imd_category:
    kind: imd_category
    variable: rain
    edges: [64.5, 115.6, 204.5]
    names: [Light/Moderate, Heavy, Very heavy, Extremely heavy]
    min_category_gap: 2
    missed_warning_from: 1      # category index of "Heavy"

  tmax_error:
    kind: absolute_error
    variable: tmax
    threshold: 3.0              # degC

  decision:
    kind: any_of
    of: [imd_category, tmax_error]

  # ---- legacy options (v1) ------------------------------------------------------------
  p95_error:                    # lead-day-specific 95th percentile of |error| (train years)
    kind: percentile_error
    percentile: 95
    group_by: [variable, lead_day]
    min_abs_error: {rain: 10.0, tmax: 2.0}

  category_flip:                # any flip across the 64.5 mm heavy-rain threshold
    kind: category_flip
    variable: rain
    thresholds: [64.5]
    count: both
